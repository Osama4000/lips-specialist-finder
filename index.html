<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIPS Specialist Finder</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans p-6">
  <div class="max-w-4xl mx-auto space-y-4">
    <header class="bg-slate-900 text-white p-4 rounded-xl flex justify-between items-center shadow">
      <h1 class="font-bold text-lg">LIPS SPECIALIST FINDER</h1>
      <span id="dbBadge" class="bg-slate-800 px-3 py-1 rounded-full text-xs">Checking Database...</span>
    </header>

    <div class="bg-white p-5 rounded-xl shadow space-y-3 border border-slate-200">
      <label class="block text-xs font-bold text-slate-600 uppercase">Patient Symptoms</label>
      <textarea id="symptoms" rows="3" placeholder="Describe symptoms (e.g. knee pain, swelling when walking)..." class="w-full border rounded p-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600"></textarea>
      <button onclick="search()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded text-sm transition">FIND SPECIALIST</button>
    </div>

    <div id="results" class="hidden space-y-4">
      <div class="bg-white p-4 rounded-xl shadow border border-slate-200 space-y-2">
        <div class="flex justify-between items-center">
          <h2 id="spec" class="text-lg font-extrabold text-blue-900">--</h2>
          <span id="conf" class="text-xs px-2.5 py-1 rounded-full font-bold bg-slate-100">--</span>
        </div>
        <p class="text-xs text-slate-500">Sub-specialty: <strong id="subspec" class="text-slate-800">--</strong></p>
        <p id="reason" class="text-xs text-slate-600 bg-slate-50 p-2 rounded border"></p>
      </div>

      <div id="docsList" class="space-y-2"></div>
    </div>
  </div>

  <script>
    async function checkDb() {
      const res = await fetch('/api/db-status');
      const data = await res.json();
      document.getElementById('dbBadge').innerText = `${data.count} Doctors Available`;
    }

    async function search() {
      const symptoms = document.getElementById('symptoms').value.trim();
      if (!symptoms) return alert("Please enter symptoms.");

      const res = await fetch('/api/find-specialist', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ symptoms })
      });

      const data = await res.json();
      if (!res.ok) return alert(data.detail || "Search failed");

      document.getElementById('spec').innerText = data.recommendation.recommended_specialty;
      document.getElementById('subspec').innerText = data.recommendation.recommended_sub_specialty;
      document.getElementById('conf').innerText = `Confidence: ${data.recommendation.confidence}`;
      document.getElementById('reason').innerText = data.recommendation.reason;

      const list = document.getElementById('docsList');
      list.innerHTML = '';
      data.doctors.forEach(d => {
        list.innerHTML += `
          <div class="bg-white p-3 rounded-lg shadow border flex justify-between items-center text-xs">
            <div>
              <strong class="text-sm block">${d.name}</strong>
              <span class="text-blue-600 font-medium">${d.specialty}</span>
            </div>
            <a href="${d.profile_url}" target="_blank" class="bg-blue-50 text-blue-700 px-3 py-1.5 rounded font-bold border border-blue-200">View Profile ↗</a>
          </div>
        `;
      });

      document.getElementById('results').classList.remove('hidden');
    }

    checkDb();
  </script>
</body>
</html>
